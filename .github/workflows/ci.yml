name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]
        node-version: [18]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install pnpm
      uses: pnpm/action-setup@v2
      with:
        version: latest

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black isort flake8

    - name: Install frontend dependencies
      run: |
        cd frontend
        pnpm install

    - name: Lint Python code
      run: |
        black --check email_validator_tool tests
        isort --check-only email_validator_tool tests
        flake8 email_validator_tool tests

    - name: Lint frontend code
      run: |
        cd frontend
        pnpm lint

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]
        node-version: [18]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install pnpm
      uses: pnpm/action-setup@v2
      with:
        version: latest

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r backend/requirements.txt
        pip install pytest pytest-asyncio

    - name: Install package in development mode
      run: |
        pip install -e .

    - name: Install frontend dependencies
      run: |
        cd frontend
        pnpm install

    - name: Run Python tests
      run: |
        pytest backend/tests/ -v

    - name: Run frontend tests
      run: |
        cd frontend
        pnpm test run

  build-docker:
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build backend Docker image
      run: |
        docker build -t email-validator-backend ./backend

    - name: Test Docker image
      run: |
        docker run --rm email-validator-backend python -c "import app; print('Backend import successful')" 