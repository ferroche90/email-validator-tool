[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "email-validator-tool"
version = "0.1.0"
description = "An advanced email validation system with comprehensive checks"
authors = [{name = "Webatix", email = "fernando@webatix.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core dependencies
    "email-validator>=2.2.0",
    "dnspython>=2.7.0",
    "disposable-email-domains>=0.0.126",
    "typer>=0.16.0",
    "asyncio>=3.4.3",
    "aiosmtplib>=4.0.1",
    "loguru>=0.7.3",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.0.0",
    "aiodns>=3.1.1",
]

[project.optional-dependencies]
backend = [
    # Backend-specific runtime requirements
    "fastapi>=0.115.14",
    "uvicorn[standard]>=0.35.0",
    "slowapi>=0.1.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.26.0",
    
    # Database and authentication
    "sqlmodel>=0.0.24",
    "alembic>=1.16.1",
    "psycopg2-binary>=2.9.9",
    "bcrypt>=4.0.1",
    "PyJWT>=2.8.0",
    "pydantic[email]>=2.11.7",
    
    # Observability
    "prometheus-fastapi-instrumentator>=6.1.0",
    
    # JWT Authentication
    "python-jose[cryptography]>=3.3.0",
    
    # CLI Key Management
    "cryptography>=41.0.0",
    "tabulate>=0.9.0",
]
dev = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=4.1.0",
    "pytest-benchmark>=4.0.0",
    "black>=25.1.0",
    "isort>=6.0.1",
    "flake8>=7.2.0",
    "locust>=2.17.0",
]

[project.scripts]
email-validator = "backend.email_validator_tool.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["email_validator_tool*"]
exclude = ["frontend*", "tests*", "*.tests*"]

[tool.black]
line-length = 120

[tool.isort]
profile = "black"

[tool.flake8]
max-line-length = 120
ignore = ["E203", "W503"]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--asyncio-mode=auto",
    "-p",
    "no:pytest-benchmark",
]
markers = [
    "benchmark: mark performance benchmark tests",
]
