[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "email-validator-tool"
version = "0.1.0"
description = "A comprehensive email validation tool"
authors = [{name = "Webatix", email = "fernando@webatix.com"}]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "email-validator>=2.2.0",
    "dnspython>=2.7.0",
    "disposable-email-domains>=0.0.126",
    "typer>=0.16.0",
    "asyncio>=3.4.3",
    "aiosmtplib>=4.0.1",
    "loguru>=0.7.3",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.0.0",
    "black>=25.1.0",
    "isort>=6.0.1",
    "flake8>=7.2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["email_validator_tool*"]
exclude = ["backend*", "frontend*", "tests*", "*.tests*"]

[tool.black]
line-length = 120

[tool.isort]
profile = "black"

[tool.flake8]
max-line-length = 120
ignore = ["E203", "W503"]
