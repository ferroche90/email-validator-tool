[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "email-validator-backend"
version = "0.1.0"
description = "Backend API for email validation tool"
authors = [{name = "Webatix", email = "fernando@webatix.com"}]
requires-python = ">=3.8"
dependencies = [
    # Backend-specific runtime requirements
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "slowapi>=0.1.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.25.0",
    
    # Database and authentication
    "sqlmodel>=0.0.8",
    "alembic>=1.12.0",
    "bcrypt>=4.0.1",
    "PyJWT>=2.8.0",
    "pydantic[email]>=2.0.0",
    
    # Observability
    "prometheus-fastapi-instrumentator>=6.1.0",
    "aiodns>=3.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=1.0.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.25.0",  # For TestClient
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--asyncio-mode=auto",
] 