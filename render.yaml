services:
  # Backend API Service
  - type: web
    name: email-validator-api
    env: docker
    repo: https://github.com/yourusername/email-validator-tool
    branch: main
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///app.db
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGINS
        value: "*"
      - key: RATE_LIMIT_REQUESTS_PER_MINUTE
        value: "60"
      - key: ENVIRONMENT
        value: "prod"
      - key: DEBUG
        value: "false"
      - key: ENABLE_DNS_CACHE
        value: "true"
      - key: DNS_CACHE_TTL_SECONDS
        value: "3600"
      - key: SMTP_TIMEOUT
        value: "10"
      - key: SMTP_PORT
        value: "25"
      - key: MAX_CONCURRENT_CONNECTIONS
        value: "10"
      - key: PER_DOMAIN_DELAY_SECONDS
        value: "1.0"
      - key: ENABLE_CATCH_ALL_DETECTION
        value: "false"
      - key: ENABLE_SMTP_VALIDATION
        value: "false"
      - key: METRICS_ALLOWLIST
        value: "127.0.0.1,::1"
      - key: ENABLE_METRICS
        value: "true"
    healthCheckPath: /health
    autoDeploy: true

  # Frontend Static Site
  - type: web
    name: email-validator-frontend
    env: static
    repo: https://github.com/yourusername/email-validator-tool
    branch: main
    plan: free
    region: oregon
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://email-validator-api.onrender.com
      - key: VITE_API_KEY
        value: your-api-key-here
    autoDeploy: true 