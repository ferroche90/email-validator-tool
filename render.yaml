services:
  - type: web
    name: email-validator-api
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        value: sqlite:///./data/email_validator.db
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGINS
        value: "*"
      - key: RATE_LIMIT_REQUESTS_PER_MINUTE
        value: 100
      - key: ENABLE_DNS_CACHE
        value: true
      - key: DNS_CACHE_TTL_SECONDS
        value: 3600
      - key: CATCH_ALL_CACHE_TTL_SECONDS
        value: 3600
      - key: SMTP_TIMEOUT
        value: 10
      - key: SMTP_PORT
        value: 25
      - key: MAX_CONCURRENT_CONNECTIONS
        value: 10
      - key: PER_DOMAIN_DELAY_SECONDS
        value: 1.0
      - key: ENABLE_CATCH_ALL
        value: false
      - key: ENABLE_SMTP
        value: false
      - key: METRICS_ALLOWLIST
        value: "127.0.0.1,::1"
      - key: ENABLE_METRICS
        value: true 